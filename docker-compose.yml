services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 10
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?Set NEO4J_USER in .env}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports: ['${NEO4J_HTTP_PORT:-7474}:7474', '${NEO4J_BOLT_PORT:-7687}:7687']
    volumes: ['neo4jdata:/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'cypher-shell -u ${NEO4J_USER:?Set NEO4J_USER in .env} -p ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env} "RETURN 1" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      start_period: 90s
      retries: 12
volumes:
  pgdata:
  neo4jdata:
